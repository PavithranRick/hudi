# Hudi Write Configuration Properties
# Base configuration shared across all write operations

# Data Source Configuration
hoodie.deltastreamer.source.dfs.root=WILL_BE_OVERRIDDEN

# Schema Provider Configuration
hoodie.deltastreamer.schemaprovider.source.schema.file=WILL_BE_OVERRIDDEN
hoodie.deltastreamer.schemaprovider.target.schema.file=WILL_BE_OVERRIDDEN

# Key Generator Configuration
hoodie.datasource.write.recordkey.field=id
hoodie.datasource.write.precombine.field=precombine_field
hoodie.datasource.write.partitionpath.field=partition_key
hoodie.datasource.write.keygenerator.class=org.apache.hudi.keygen.SimpleKeyGenerator

# Partition Configuration
hoodie.table.partition.fields=partition_key
hoodie.datasource.write.drop.partition.columns=false

# Performance Tuning
hoodie.parquet.small.file.limit=-1
hoodie.metadata.enable=false
hoodie.enable.data.skipping=false

# Write Configuration
hoodie.datasource.write.operation=upsert
hoodie.upsert.shuffle.parallelism=200
hoodie.insert.shuffle.parallelism=200

# Cleaner Configuration
hoodie.cleaner.policy=KEEP_LATEST_COMMITS
hoodie.cleaner.commits.retained=3

# Archival Configuration
hoodie.keep.min.commits=4
hoodie.keep.max.commits=5

# Logging
hoodie.logfile.data.block.max.size=268435456
hoodie.logfile.max.size=1073741824
